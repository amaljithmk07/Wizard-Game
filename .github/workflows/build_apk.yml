name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK for Distribution
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Wizard-Game.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wizard-Game-APK
          path: build/app/outputs/flutter-apk/Wizard-Game.apk
          retention-days: 14

      # If triggered by a version tag (e.g. v1.0.1), attach the APK to the GitHub Release
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/Wizard-Game.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # If pushed directly to main, update or create a rolling "latest" release
      - name: Update Latest Release (Main Branch)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Wizard Game (Latest Build)
          body: |
            Automatic build from latest commit to `main` (`${{ github.sha }}`).
            
            Download **`Wizard-Game.apk`** below to install on your Android device.
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/Wizard-Game.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
